# V1 processed-layer metadata (Spec Step 9 requirement)
criterion: legal_ownership
askja_metric: 10           # Economic & Legal Context (the r4-promoted gate criterion)
tier: 1                    # per-jurisdiction structured layer, compiled from primary legal sources via the dossiers
source: "Primary legal texts and official guidance opened for the 2026-10 legal pathway pass (Diário da República, BOE, Riigi Teataja, legislatie.just.ro, Publications du Québec, Arkansas Legislature, National Agricultural Law Center and others); each entry carries its primary source in its `source` property. Statements no opened source supported are removed or say `not verified`."
source_url: "see per-feature `source_url` for the primary source"
vintage: "2026-05 compilation; per-feature regulatory_notes carry the latest known change; re-verified and extended to 30 regions 2026-10"
license: "Research dossiers internal; underlying primary sources carry their own licenses (typically open government)"
native_unit: "per-jurisdiction (point at region centroid)"
time_framing: "state + trajectory"
state: "current ownership / collective-form / residency / preemption / planning regime per region"
trajectory: "per-feature regulatory_direction enum (stable|tightening|loosening|volatile)"
sovereignty_axes: [legal]
red_line_underlying: collective-ownership-legality
files:
  - { path: legal-ownership.geojson, scope: "EU + NA", features: 30 }
  - { path: legal-ownership.json, kind: "structured extraction (human-verifiable intermediate)" }
coverage: "30 of 30 in-scope regions = 100% per-jurisdiction completeness (20 original regions rewritten from sources opened 2026-10-05, 10 new regions from their verified region packages). Per-jurisdiction qualitative criteria use completeness rather than areal coverage (see coverage-report.md three-way metric). Every record carries data_confidence (how well the entry is sourced; never a grade of the place)."
processing_method: "scripts/compile_per_jurisdiction.py legal-ownership reads the JSON intermediate + regions.js coords and emits the GeoJSON FeatureCollection. The JSON is the human-verifiable artifact (Spec Step 4); the 2026-10 pass rewrote the 20 original records from sources opened for the legal pathway entries and added the 10 new regions. The geojson is generated: never edit it by hand."
notes: "Orientation from public sources, not legal advice. Foreign-purchase rules are stated only as far as an opened source supports them; `foreign_ownership.allowed` is a filter value (yes|restricted|no), `restricted` meaning a statute bars or conditions some buyers, and the notes say which. Carries red-line underlying data for collective-ownership legality (Overview decision 9). r4 Finding 1a delivered: legal/ownership now exists as a first-class V1 layer rather than buried mid-list."
properties_schema:
  foreign_ownership: { allowed: "yes|restricted|no", notes: "string" }
  collective_ownership_path: "string"
  multi_household_residence_as_of_right: "yes|no|conditional"
  residency_required_for_purchase: "yes|no|conditional"
  preemption_or_first_claim_holders: "array of strings"
  planning_gate_for_living: "string"
  key_legal_restriction: "string"
  regulatory_direction: "stable|tightening|loosening|volatile"
  regulatory_notes: "string"
  data_confidence: "high|medium|low (how well the entry is sourced; a statement about the evidence, never about the place)"
  source: "string (primary legal source)"
  source_url: "string"
  gaps: "string (anything the dossier did not cover)"
